name: Update Propathlima standings

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-standings:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Fetch latest standings
        run: python3 scripts/update_standings.py
      - name: Publish JSON if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/standings-live.json
          if git diff --cached --quiet; then
            echo "Standings have not changed."
          else
            git commit -m "Update Propathlima standings"
            git push
          fi
