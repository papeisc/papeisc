/* Logo: κόβει τα κενά γύρω-γύρω και το βάζει σε τετράγωνο 256x256 με ίδια περιθώρια, ώστε όλα τα logos να φαίνονται ίδιου μεγέθους */
function normLogo(f){return new Promise(function(res,rej){if(f.type==="image/svg+xml")return res(f);var im=new Image(),u=URL.createObjectURL(f);im.onload=function(){
 var S=256,P=16,k0=Math.min(1,1200/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.round(im.naturalWidth*k0),h=Math.round(im.naturalHeight*k0),c=document.createElement("canvas");c.width=w;c.height=h;var x=c.getContext("2d");x.drawImage(im,0,0,w,h);URL.revokeObjectURL(u);

 if(x1<x0){x0=0;y0=0;x1=w-1;y1=h-1}
 var cw=x1-x0+1,ch=y1-y0+1,k=(S-2*P)/Math.max(cw,ch),o=document.createElement("canvas");o.width=o.height=S;var ox=o.getContext("2d");ox.imageSmoothingQuality="high";ox.drawImage(c,x0,y0,cw,ch,(S-cw*k)/2,(S-ch*k)/2,cw*k,ch*k);
 o.toBlob(function(b){b?res(new File([b],f.name.replace(/\.\w+$/,"")+".png",{type:"image/png"})):res(f)},"image/png")};im.onerror=function(){URL.revokeObjectURL(u);rej("Το logo δεν μπόρεσε να διαβαστεί. Δοκίμασε PNG ή SVG.")};im.src=u})}

 var edit=function(p){$("fm").innerHTML='<div class="box"><b>'+(p.id?"Επεξεργασία":"Νέος παίκτης")+"</b>"+(p.photo_path?'<p><img src="'+esc(url(p.photo_path))+'" alt="" style="height:90px;border-radius:6px;border:1px solid var(--line)"></p>':"")+F(PF,Object.assign({},p,{details_txt:det2txt(p.details)}))+'<p><button class="btn2 pri" id="sv">Αποθήκευση</button> '+(p.id?'<button class="btn2" id="dl">Διαγραφή</button> ':"")+'<button class="btn2" id="cn">Άκυρο</button></p></div>';
  $("cn").onclick=function(){$("fm").innerHTML=btn};$("fm").scrollIntoView({behavior:"smooth",block:"start"});

  seasons=S.map(function(r){return r.season}).filter(function(v,i,a){return v&&a.indexOf(v)===i}).sort().reverse(),season=window._ssn||seasons[0]||"2026/27",

 function pts(r){return(+r.won||0)*3+(+r.drawn||0)}
 function draw(){
  $("pg").innerHTML='<div class="box"><b>Βαθμολογία</b><p class="hint">Η βαθμολογία του site διαβάζεται από εδώ και ανανεώνεται ζωντανά σε όλους τους επισκέπτες μόλις πατήσεις Αποθήκευση. Αν υπάρχει αυτόματος συγχρονισμός από το Προπάθλημα που γράφει στον ίδιο πίνακα, μπορεί να αντικαταστήσει αυτά που βάζεις εδώ.</p>'+

   '<div class="box"><b>Γρήγορη επικόλληση από το Προπάθλημα</b><p class="hint">Αντίγραψε τον πίνακα από τη σελίδα και κόλλησέ τον. Μία ομάδα ανά γραμμή, μορφή: θέση, όνομα, αγώνες, νίκες, ισοπαλίες, ήττες, γκολ (π.χ. 12-5), βαθμοί. Το διαφορά τερμάτων (αν υπάρχει) αγνοείται.</p><textarea class="pw" id="pw" placeholder="1 ΠΑΠΕΙ SC 5 4 1 0 12-3 13"></textarea><p><button class="btn2" id="pp">Ανάλυση κειμένου</button></p></div>'+
   '<div class="box"><div class="tw2"><table class="stt"><thead><tr><th>#</th><th>Ομάδα</th><th>Αγ</th><th>Ν</th><th>Ι</th><th>Η</th><th>ΓΥ</th><th>ΓΚ</th><th>Βαθ</th><th></th></tr></thead><tbody>'+

 $("ctl").addEventListener("toggle",function(e){var d=e.target;if(d.dataset&&d.dataset.g){OPEN[d.dataset.g]=d.open?1:0;window._dopen=OPEN}},true);
 $("pg").oninput=function(e){var t=e.target,k;
  if(t.id==="tq"){var v=t.value.toLowerCase();[].forEach.call($("tl").children,function(l){l.hidden=v&&l.textContent.toLowerCase().indexOf(v)<0&&(l.querySelector("input").value||"").toLowerCase().indexOf(v)<0});return}

  else if(t.dataset.tx)D.texts[t.dataset.tx]=t.value;
  else if(t.dataset.an){k=t.dataset.an;D.announce[k]=t.type==="checkbox"?t.checked:t.value}

  else if(t.classList.contains("ck2"))D.sections[+t.dataset.i].on=t.checked;
  else return;push()};
 $("pg").onchange=function(e){var t=e.target;if(t.dataset.im&&t.files[0])run(async function(){var f=t.files[0],m=DESIGN_IMAGES.filter(function(x){return x[0]===t.dataset.im})[0];
  if(!/^image\//.test(f.type))throw"Διάλεξε αρχείο εικόνας";

 $("pg").onclick=function(e){var t=e.target,i;
  if(t.dataset.pr!=null){var p=DESIGN_PRESETS[+t.dataset.pr];["light","dark"].forEach(function(m){D.colors[m].navy=p.c[m].navy;D.colors[m].acc=p.c[m].acc});ctl();push();return}

  if(t.id==="sd2")run(async function(){await q(sb.from("site_settings").upsert({key:"design",draft:D,updated_at:new Date().toISOString()},{onConflict:"key"}));saved=designClean(D);push();toast("Το πρόχειρο αποθηκεύτηκε (δεν φαίνεται ακόμα στο site)")});

  var names={};names[US]=1;Object.keys(SEASONS).forEach(function(k){SEASONS[k].forEach(function(m){names[m[1]]=1;names[m[4]]=1})});if(NEXT){names[NEXT.home]=1;names[NEXT.away]=1}

  await q(sb.from("team_aliases").upsert(T.map(function(t){return{alias:t.name,team_id:t.id}}),{onConflict:"alias"}));
  await q(sb.from("players").upsert(P.map(function(p){return{full_name:p[0],slug:slug(p[0]),base_apps:p[1],base_goals:p[2],base_assists:p[3],show_on_roster:HIDE.indexOf(p[0])<0}}),{onConflict:"slug"}));

  if(NEXT)R.push({season:"2026/27",competition:"Πρωτάθλημα",kickoff:ath(NEXT.date,NEXT.time).toISOString(),home_team:id[NEXT.home],away_team:id[NEXT.away],status:"scheduled",venue:NEXT.venue||null,venue_map_url:NEXT.map||null,source:"manual",locked:true});
  for(var i=0;i<R.length;i+=40)await q(sb.from("matches").insert(R.slice(i,i+40)));say("Έγινε εισαγωγή: "+T.length+" ομάδες, "+P.length+" παίκτες, "+R.length+" αγώνες")})};};
